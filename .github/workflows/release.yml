name: Build and Release (Windows & Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 binutils

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Build single-file Linux binary
        run: bash build_linux.sh

      - uses: actions/upload-artifact@v4
        with:
          name: OcarinaRemakeManager-Linux-x64
          path: dist_linux/OcarinaRemakeManager-Linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip -r requirements.txt pyinstaller

      - name: Build single-file Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name OcarinaRemakeManager `
            --add-data "i18n;i18n" `
            --collect-submodules PIL `
            --hidden-import PIL.Image `
            --distpath dist_win `
            --workpath build_win_tmp `
            app.py

      - uses: actions/upload-artifact@v4
        with:
          name: OcarinaRemakeManager-Windows-x64
          path: dist_win/OcarinaRemakeManager.exe

  publish-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          generate_release_notes: true
